  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Retimed for the 30s voiced cut: authored against 6s, scaled to the synced 3.618s.
      const K = 3.618 / 6;
      const T = (x) => x * K;

      // One camera state drives the whole world: pan progress p (0 → 1), tilt, and zoom.
      const cam = { p: 0, tilt: -14, zoom: 1.22 };
      const world = document.getElementById("disc-world");
      const back = document.getElementById("disc-back");
      const mid = document.getElementById("disc-mid");
      const front = document.getElementById("disc-front");
      function applyCam() {
        // Mid layer travels +500 → -1300 (1800px); back at half speed, front at 1.6x.
        const midX = 500 - 1800 * cam.p;
        gsap.set(mid, { x: midX });
        gsap.set(back, { x: 250 - 900 * cam.p });
        gsap.set(front, { x: 800 - 2880 * cam.p });
        gsap.set(world, { rotationY: cam.tilt, scale: cam.zoom });
      }
      applyCam();

      // Scene 1 (0.0–1.6s) — angled close-up on "Warm"; the cards settle in, neighbours soft.
      tl.fromTo(".disc-m, #disc-grad, #disc-picker", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: T(0.9), ease: "power3.out", stagger: T(0.06) }, T(0.05));
      tl.fromTo(cam, { p: 0, tilt: -14, zoom: 1.22 }, { p: 0.08, tilt: -12, zoom: 1.2, duration: T(1.6), ease: "power2.out", onUpdate: applyCam }, T(0));

      // Scene 2 (1.6–4.0s) — one slow lateral flight; the world tilts flat to straight-on.
      tl.fromTo(cam, { p: 0.08, tilt: -12, zoom: 1.2 }, { p: 0.86, tilt: -2, zoom: 1.04, duration: T(2.4), ease: "power1.inOut", onUpdate: applyCam, immediateRender: false }, T(1.6));
      // Light velocity blur on the foreground chips — peaks mid-travel, clears at the settle.
      tl.fromTo(front, { filter: "blur(7px)" }, { filter: "blur(12px)", duration: T(1.2), ease: "power1.in" }, T(1.6));
      tl.fromTo(front, { filter: "blur(12px)" }, { filter: "blur(7px)", duration: T(1.2), ease: "power1.out", immediateRender: false }, T(2.8));

      // Scene 3 (4.0–6.0s) — decelerate into focus on the gradient + picker pair; rack focus off the rest.
      tl.fromTo(cam, { p: 0.86, tilt: -2, zoom: 1.04 }, { p: 1, tilt: 0, zoom: 1, duration: T(1.4), ease: "power4.out", onUpdate: applyCam, immediateRender: false }, T(4.0));
      tl.fromTo(".disc-m", { filter: "blur(0px)", opacity: 1 }, { filter: "blur(4px)", opacity: 0.55, duration: T(0.9), ease: "power2.out", immediateRender: false }, T(4.1));
      tl.fromTo("#disc-headline .disc-word",
