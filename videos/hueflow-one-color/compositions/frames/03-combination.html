    (function () {
      const tl = gsap.timeline({ paused: true });
      const CX = 530, CY = 520, R = 184;
      const COMP_OFFSET = 197; // resting complement of hue 16 lands on the site's #1D4E89

      function hslToHex(h, s, l) {
        h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
        const k = (n) => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        const to = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
        return ("#" + to(f(0)) + to(f(8)) + to(f(4))).toUpperCase();
      }
      // Anchor the live pair to the brand hexes exactly at rest (hue 16), interpolate hsl elsewhere.
      function pairColors(h) {
        const d = h - 16;
        if (Math.abs(d) < 0.01) return ["#E8531F", "#1D4E89"];
        return [hslToHex(h, 81, 52), hslToHex(h + COMP_OFFSET, 65, 33)];
      }

      const arm0 = document.getElementById("combo-arm0");
      const arm1 = document.getElementById("combo-arm1");
      const cursor = document.getElementById("combo-cursor");
      const pa = document.getElementById("combo-pair-a");
      const pb = document.getElementById("combo-pair-b");
      const ha = document.getElementById("combo-pair-ha");
      const hb = document.getElementById("combo-pair-hb");

      function tipAt(h) {
        const r = (h * Math.PI) / 180;
        return { x: CX + R * Math.sin(r) + 4, y: CY - R * Math.cos(r) + 4 };
      }
      const hue = { h: 16 };
      function applyHue() {
        const h = hue.h;
        gsap.set(arm0, { rotation: h });
        gsap.set(arm1, { rotation: h + COMP_OFFSET });
        const c = pairColors(h);
        pa.style.background = c[0]; pb.style.background = c[1];
        ha.textContent = c[0]; hb.textContent = c[1];
        const p = tipAt(h);
        gsap.set(cursor, { x: p.x, y: p.y });
      }

      // Retimed for the 30s voiced cut (2.991s, VO "Explore every combination."):
      // one drag that carries the handle to the triadic position, then a single Triadic click.

      // Baselines

      gsap.set("#combo-arm0", { rotation: 16 });
      gsap.set("#combo-arm1", { rotation: 16 + COMP_OFFSET });
      gsap.set(["#combo-g1", "#combo-g2"], { opacity: 0 });
      gsap.set(["#combo-mode1", "#combo-mode2"], { opacity: 0 });
      gsap.set("#combo-chip0", { color: "#E8531F" });
      gsap.set(["#combo-chip1", "#combo-chip2"], { color: "#766F66" });
      gsap.set("#combo-chip-select", { x: 0, scaleX: 1 });

      gsap.set(["#combo-pulse1", "#combo-pulse2"], { scale: 0.2, opacity: 0 });

      // Scene 1 (0.0–0.6s) — panel, wheel and the complementary pair establish (entering under the push-slide).
      tl.fromTo("#combo-panel", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.0);
      tl.fromTo(["#combo-panel-title", "#combo-panel-sub"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.05 }, 0.08);
      tl.fromTo(["#combo-wheel", "#combo-wheel-core"], { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.05);
      tl.fromTo(["#combo-arm0", "#combo-arm1"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.3);
      tl.fromTo([".combo-chip", "#combo-chip-select"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.04 }, 0.2);
      tl.fromTo("#combo-mode", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.2);
      tl.fromTo("#combo-g0", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.12);

      // Scene 2 (0.5–1.75s) — the cursor grabs the handle and drags it round to the green hue;
      // the complement arm and the pair cards recolour live in the same beat.
      const start = tipAt(16);
      tl.fromTo("#combo-cursor", { x: 2000, y: 1120 }, { x: start.x, y: start.y, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.2);
      tl.fromTo("#combo-cursor svg", { scale: 1 }, { scale: 0.88, duration: 0.1, ease: "power2.in" }, 0.72);
      tl.fromTo(hue, { h: 16 }, { h: 136, duration: 0.95, ease: "power2.inOut", onUpdate: applyHue, immediateRender: false }, 0.8);
      tl.fromTo("#combo-cursor svg", { scale: 0.88 }, { scale: 1, duration: 0.18, ease: "power3.out", immediateRender: false }, 1.78);

      // The headline lands while the voice says it.
      tl.fromTo("#combo-headline .combo-word",
        { opacity: 0, y: 16, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.09 }, 0.45);

      // Scene 3 (1.8–2.99s) — click Triadic: markers settle at 120° steps, the three-card set lands, hold.
      const chip2 = { x: 652, y: 800 };
      const here = tipAt(136);
      tl.fromTo("#combo-cursor", { x: here.x, y: here.y }, { x: chip2.x, y: chip2.y, duration: 0.38, ease: "power3.inOut", immediateRender: false }, 1.84);
      tl.fromTo("#combo-cursor svg", { scale: 1 }, { scale: 0.88, duration: 0.08, ease: "power2.in", immediateRender: false }, 2.24);
      tl.fromTo("#combo-cursor svg", { scale: 0.88 }, { scale: 1, duration: 0.18, ease: "power3.out", immediateRender: false }, 2.33);
      tl.fromTo("#combo-pulse2", { x: chip2.x - 4, y: chip2.y - 4, scale: 0.2, opacity: 0.9 }, { x: chip2.x - 4, y: chip2.y - 4, scale: 2.2, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 2.27);
      tl.fromTo("#combo-chip-select", { x: 0, scaleX: 1 }, { x: 380, scaleX: 132 / 196, duration: 0.36, ease: "power3.inOut", immediateRender: false }, 2.27);
      tl.fromTo("#combo-chip0", { color: "#E8531F" }, { color: "#766F66", duration: 0.2, immediateRender: false }, 2.3);
      tl.fromTo("#combo-chip2", { color: "#766F66" }, { color: "#E8531F", duration: 0.2, immediateRender: false }, 2.3);
      tl.fromTo("#combo-arm1", { rotation: 136 + COMP_OFFSET }, { rotation: 256, duration: 0.4, ease: "power3.inOut", immediateRender: false }, 2.29);
